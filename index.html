<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .game-container {

            height: 100vh;

            height: 100%;

<body>

    <div class="game-container">
        <!-- Embeddable HTML5 game URL -->
        <iframe 
            src="https://geometrydash.ee/game/subway-surfers/"

        </iframe>
    </div>

</body>
</html>
